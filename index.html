<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Real Estate Concepts — Client Presentation Hub</title>
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Plus+Jakarta+Sans:wght@400;500;600;700;800&display=swap" rel="stylesheet">
  <style>
    * {
      margin: 0;
      padding: 0;
      box-sizing: border-box;
    }

    body {
      font-family: 'Plus Jakarta Sans', -apple-system, BlinkMacSystemFont, sans-serif;
      background: #0f1115;
      color: #ffffff;
      height: 100vh;
      display: flex;
      flex-direction: column;
      overflow: hidden;
      -webkit-font-smoothing: antialiased;
    }

    /* ==========================================================
       TOP PRESENTATION TOOLBAR
       ========================================================== */
    .showcase-toolbar {
      height: 60px;
      background: rgba(18, 20, 26, 0.95);
      backdrop-filter: blur(16px);
      -webkit-backdrop-filter: blur(16px);
      border-bottom: 1px solid rgba(255, 255, 255, 0.08);
      display: flex;
      align-items: center;
      justify-content: space-between;
      padding: 0 24px;
      z-index: 100;
      transition: transform 0.3s cubic-bezier(0.16, 1, 0.3, 1), opacity 0.3s ease;
    }

    .showcase-toolbar.hidden {
      transform: translateY(-100%);
      pointer-events: none;
      position: absolute;
    }

    .toolbar-left {
      display: flex;
      align-items: center;
      gap: 16px;
    }

    .badge-hub {
      display: flex;
      align-items: center;
      gap: 8px;
      background: rgba(255, 255, 255, 0.06);
      border: 1px solid rgba(255, 255, 255, 0.1);
      padding: 6px 12px;
      border-radius: 9999px;
      font-size: 13px;
      font-weight: 600;
      letter-spacing: -0.01em;
    }

    .live-dot {
      width: 8px;
      height: 8px;
      border-radius: 50%;
      background: #10b981;
      box-shadow: 0 0 10px #10b981;
      animation: pulseDot 2s infinite;
    }

    @keyframes pulseDot {
      0%, 100% { opacity: 1; transform: scale(1); }
      50% { opacity: 0.5; transform: scale(0.85); }
    }

    /* CONCEPT SELECTOR DROPDOWN */
    .selector-wrapper {
      display: flex;
      align-items: center;
      gap: 10px;
      background: rgba(255, 255, 255, 0.08);
      border: 1px solid rgba(255, 255, 255, 0.15);
      border-radius: 10px;
      padding: 4px 12px;
      transition: all 0.2s ease;
    }

    .selector-wrapper:hover {
      border-color: rgba(255, 255, 255, 0.3);
      background: rgba(255, 255, 255, 0.12);
    }

    .selector-label {
      font-size: 11px;
      text-transform: uppercase;
      letter-spacing: 0.06em;
      color: rgba(255, 255, 255, 0.5);
      font-weight: 700;
    }

    .concept-select {
      background: transparent;
      border: none;
      outline: none;
      color: #ffffff;
      font-family: inherit;
      font-size: 14px;
      font-weight: 600;
      cursor: pointer;
      padding: 4px 4px;
    }

    .concept-select option {
      background: #1a1d24;
      color: #ffffff;
      padding: 10px;
    }

    /* DEVICE SWITCHER */
    .toolbar-center {
      display: flex;
      align-items: center;
      background: rgba(255, 255, 255, 0.06);
      border: 1px solid rgba(255, 255, 255, 0.1);
      border-radius: 8px;
      padding: 3px;
      gap: 2px;
    }

    .view-btn {
      background: transparent;
      border: none;
      color: rgba(255, 255, 255, 0.6);
      padding: 6px 14px;
      border-radius: 6px;
      font-size: 13px;
      font-weight: 600;
      font-family: inherit;
      cursor: pointer;
      display: flex;
      align-items: center;
      gap: 6px;
      transition: all 0.2s ease;
    }

    .view-btn:hover {
      color: #ffffff;
    }

    .view-btn.active {
      background: #ffffff;
      color: #111111;
      box-shadow: 0 2px 8px rgba(0, 0, 0, 0.25);
    }

    /* RIGHT ACTIONS */
    .toolbar-right {
      display: flex;
      align-items: center;
      gap: 12px;
    }

    .action-btn {
      background: rgba(255, 255, 255, 0.08);
      border: 1px solid rgba(255, 255, 255, 0.12);
      color: #ffffff;
      padding: 7px 14px;
      border-radius: 8px;
      font-size: 13px;
      font-weight: 600;
      font-family: inherit;
      cursor: pointer;
      display: flex;
      align-items: center;
      gap: 6px;
      text-decoration: none;
      transition: all 0.2s ease;
    }

    .action-btn:hover {
      background: rgba(255, 255, 255, 0.16);
      border-color: rgba(255, 255, 255, 0.25);
    }

    /* FLOATING UNHIDE PILL */
    .unhide-trigger {
      position: fixed;
      top: 16px;
      right: 20px;
      background: rgba(18, 20, 26, 0.9);
      backdrop-filter: blur(12px);
      border: 1px solid rgba(255, 255, 255, 0.2);
      color: #ffffff;
      padding: 8px 16px;
      border-radius: 9999px;
      font-size: 13px;
      font-weight: 600;
      cursor: pointer;
      display: none;
      align-items: center;
      gap: 8px;
      box-shadow: 0 8px 24px rgba(0, 0, 0, 0.4);
      z-index: 1000;
      transition: all 0.2s ease;
    }

    .unhide-trigger:hover {
      background: #ffffff;
      color: #111111;
      transform: translateY(-1px);
    }

    .unhide-trigger.active {
      display: flex;
    }

    /* ==========================================================
       VIEWPORT STAGE / PREVIEW FRAME
       ========================================================== */
    .preview-stage {
      flex: 1;
      display: flex;
      align-items: center;
      justify-content: center;
      background: #090a0d;
      position: relative;
      overflow: hidden;
      padding: 0;
      transition: padding 0.3s ease;
    }

    .preview-stage.device-view {
      padding: 24px 0;
    }

    .preview-frame-wrapper {
      width: 100%;
      height: 100%;
      transition: width 0.4s cubic-bezier(0.16, 1, 0.3, 1), height 0.4s cubic-bezier(0.16, 1, 0.3, 1), border-radius 0.3s ease;
      background: #ffffff;
      position: relative;
      overflow: hidden;
    }

    /* Device frame modes */
    .preview-frame-wrapper.tablet {
      width: 768px;
      max-width: 95vw;
      height: 94%;
      border-radius: 28px;
      border: 10px solid #20232b;
      box-shadow: 0 25px 60px rgba(0, 0, 0, 0.6);
    }

    .preview-frame-wrapper.mobile {
      width: 390px;
      max-width: 92vw;
      height: 94%;
      border-radius: 36px;
      border: 10px solid #20232b;
      box-shadow: 0 25px 60px rgba(0, 0, 0, 0.6);
    }

    @media (max-width: 768px) {
      .showcase-toolbar {
        height: auto;
        padding: 10px 14px;
        flex-wrap: wrap;
        gap: 8px;
      }
      .toolbar-center {
        display: none; /* Hide device switcher on actual mobile devices */
      }
      .badge-hub {
        display: none;
      }
      .concept-select {
        max-width: 200px;
        font-size: 13px;
      }
    }

    iframe {
      width: 100%;
      height: 100%;
      border: none;
      display: block;
    }

    /* Placeholder Screen for upcoming designs */
    .placeholder-view {
      display: none;
      flex-direction: column;
      align-items: center;
      justify-content: center;
      width: 100%;
      height: 100%;
      background: #14161d;
      color: #ffffff;
      text-align: center;
      padding: 40px;
    }

    .placeholder-view.active {
      display: flex;
    }

    .placeholder-badge {
      font-size: 12px;
      font-weight: 700;
      letter-spacing: 0.1em;
      text-transform: uppercase;
      padding: 6px 14px;
      border-radius: 9999px;
      background: rgba(255, 255, 255, 0.1);
      margin-bottom: 20px;
      color: #a0aec0;
    }

    .placeholder-title {
      font-size: 32px;
      font-weight: 700;
      margin-bottom: 12px;
      letter-spacing: -0.02em;
    }

    .placeholder-desc {
      font-size: 16px;
      color: #94a3b8;
      max-width: 480px;
      line-height: 1.6;
      margin-bottom: 32px;
    }

    .placeholder-btn {
      background: #ffffff;
      color: #111111;
      padding: 12px 24px;
      border-radius: 8px;
      font-weight: 700;
      font-size: 14px;
      cursor: pointer;
      transition: all 0.2s ease;
    }

    .placeholder-btn:hover {
      background: #e2e8f0;
      transform: translateY(-2px);
    }
  </style>
</head>
<body>

  <!-- ==================== TOP SHOWCASE TOOLBAR ==================== -->
  <header class="showcase-toolbar" id="toolbar">
    
    <!-- Left: Brand / Project Indicator -->
    <div class="toolbar-left">
      <div class="badge-hub">
        <span class="live-dot"></span>
        <span>Client Presentation Hub</span>
      </div>

      <!-- DESIGN DROPDOWN SELECTOR -->
      <div class="selector-wrapper">
        <span class="selector-label">Design</span>
        <select class="concept-select" id="conceptSelect" onchange="onConceptChange(this.value)">
          <option value="1">01. Poperty — Architectural Minimalist (Live)</option>
          <option value="2">02. Spaciaz — Landmark Developer & Capital (Live)</option>
          <option value="3">03. Realnest — Editorial Buy & Rent (Live)</option>
          <option value="4">04. Aangan — Ultra-Luxury Indian Heritage (Live 🇮🇳)</option>
          <option value="5">05. GrihaDirect — Smart Indian PropTech (Live 🇮🇳)</option>
        </select>
      </div>
    </div>

    <!-- Center: Responsive Device Preview Switcher -->
    <div class="toolbar-center">
      <button class="view-btn active" id="btnDesktop" onclick="setDeviceMode('desktop')">
        <span>💻</span>
        <span>Desktop</span>
      </button>
      <button class="view-btn" id="btnTablet" onclick="setDeviceMode('tablet')">
        <span>📱</span>
        <span>Tablet</span>
      </button>
      <button class="view-btn" id="btnMobile" onclick="setDeviceMode('mobile')">
        <span>📲</span>
        <span>Mobile</span>
      </button>
    </div>

    <!-- Right: Quick Actions -->
    <div class="toolbar-right">
      <a href="designs/design1/index.html" target="_blank" class="action-btn" id="directLinkBtn" title="Open selected design in standalone tab">
        <span>Open Standalone</span>
        <span>↗</span>
      </a>
      <button class="action-btn" onclick="toggleToolbar()" title="Hide toolbar for clean presentation view">
        <span>Hide Bar</span>
        <span>✕</span>
      </button>
    </div>

  </header>

  <!-- Floating button to restore toolbar when hidden -->
  <button class="unhide-trigger" id="unhideTrigger" onclick="toggleToolbar()">
    <span>⚙ Show Controls</span>
  </button>

  <!-- ==================== MAIN PREVIEW VIEWPORT ==================== -->
  <main class="preview-stage" id="previewStage">
    
    <!-- Standalone frame wrapper -->
    <div class="preview-frame-wrapper" id="frameWrapper">
      
      <!-- Live Iframe for loaded design -->
      <iframe src="designs/design1/index.html" id="previewIframe" title="Mockup Design Preview"></iframe>

      <!-- Placeholder Screen for remaining 4 designs -->
      <div class="placeholder-view" id="placeholderView">
        <div class="placeholder-badge">Awaiting Design Upload</div>
        <h2 class="placeholder-title" id="placeholderTitle">Concept Slot Ready</h2>
        <p class="placeholder-desc" id="placeholderDesc">
          Share your next screenshot or design brief, and it will immediately appear right here in this slot.
        </p>
        <button class="placeholder-btn" onclick="onConceptChange('1')">
          ← Return to Concept 01 (Poperty)
        </button>
      </div>

    </div>

  </main>

  <script>
    const conceptSelect = document.getElementById('conceptSelect');
    const previewIframe = document.getElementById('previewIframe');
    const placeholderView = document.getElementById('placeholderView');
    const placeholderTitle = document.getElementById('placeholderTitle');
    const placeholderDesc = document.getElementById('placeholderDesc');
    const directLinkBtn = document.getElementById('directLinkBtn');
    const frameWrapper = document.getElementById('frameWrapper');
    const previewStage = document.getElementById('previewStage');
    const toolbar = document.getElementById('toolbar');
    const unhideTrigger = document.getElementById('unhideTrigger');

    // Available concepts map
    const concepts = {
      '1': {
        name: 'Poperty — Architectural Minimalist',
        path: 'designs/design1/index.html',
        ready: true
      },
      '2': {
        name: 'Spaciaz — Landmark Developer & Capital',
        path: 'designs/design2/index.html',
        ready: true
      },
      '3': {
        name: 'Realnest — Editorial Buy & Rent',
        path: 'designs/design3/index.html',
        ready: true
      },
      '4': {
        name: 'Aangan — Ultra-Luxury Indian Heritage',
        path: 'designs/design4/index.html',
        ready: true
      },
      '5': {
        name: 'GrihaDirect — Smart Indian PropTech',
        path: 'designs/design5/index.html',
        ready: true
      }
    };

    function onConceptChange(val) {
      conceptSelect.value = val;
      const concept = concepts[val];

      if (concept && concept.ready) {
        previewIframe.style.display = 'block';
        placeholderView.classList.remove('active');
        previewIframe.src = concept.path;
        directLinkBtn.href = concept.path;
        window.location.hash = `concept-${val}`;
      } else {
        previewIframe.style.display = 'none';
        placeholderView.classList.add('active');
        placeholderTitle.textContent = `${concept ? concept.name : 'Concept ' + val} Ready for Implementation`;
        placeholderDesc.textContent = 'Share the screenshot or brief for this design, and I will complete the full interactive website for this slot!';
        directLinkBtn.href = '#';
        window.location.hash = `concept-${val}`;
      }
    }

    // Responsive device frame modes
    function setDeviceMode(mode) {
      document.querySelectorAll('.view-btn').forEach(btn => btn.classList.remove('active'));

      frameWrapper.classList.remove('tablet', 'mobile');
      previewStage.classList.remove('device-view');

      if (mode === 'desktop') {
        document.getElementById('btnDesktop').classList.add('active');
      } else if (mode === 'tablet') {
        document.getElementById('btnTablet').classList.add('active');
        frameWrapper.classList.add('tablet');
        previewStage.classList.add('device-view');
      } else if (mode === 'mobile') {
        document.getElementById('btnMobile').classList.add('active');
        frameWrapper.classList.add('mobile');
        previewStage.classList.add('device-view');
      }
    }

    // Hide / Unhide Toolbar
    function toggleToolbar() {
      const isHidden = toolbar.classList.toggle('hidden');
      if (isHidden) {
        unhideTrigger.classList.add('active');
      } else {
        unhideTrigger.classList.remove('active');
      }
    }

    // Hash check on load
    window.addEventListener('DOMContentLoaded', () => {
      const hash = window.location.hash.replace('#concept-', '');
      if (hash && concepts[hash]) {
        onConceptChange(hash);
      }
    });
  </script>
</body>
</html>
